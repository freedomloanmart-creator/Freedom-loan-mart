<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>FLM Store Panel - Coupon Redemption</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box;font-family:Inter,system-ui}body{margin:0;background:#f0fdf4;color:#0f172a;padding:12px}
.card{background:#fff;border-radius:16px;padding:16px;margin-bottom:12px;box-shadow:0 1px 4px #0001}
input{width:100%;padding:13px;border:1px solid #e2e8f0;border-radius:10px;margin-top:8px;font-size:16px}
button{width:100%;padding:13px;border:0;border-radius:10px;font-weight:800;margin-top:10px;font-size:16px}
.green{background:#059669;color:white}.blue{background:#2563eb;color:white}
.ok{background:#dcfce7;color:#059669;padding:12px;border-radius:10px;font-weight:800}
.err{background:#fee2e2;color:#dc2626;padding:12px;border-radius:10px;font-weight:700}
.small{font-size:11px;color:#64748b}
</style></head><body>

<div class="card" style="background:linear-gradient(135deg,#059669,#0d9488);color:white">
<h2>🏪 FLM Store Panel</h2><p>Coupon redemption for all active FLM stores</p></div>

<div class="card" id="loginCard">
<h3>Store Login</h3>
<input id="storeCode" placeholder="Store Code (e.g. FLM-KHM-001)">
<input id="storePhone" placeholder="Store Phone" type="tel">
<button class="green" onclick="storeLogin()">Login</button>
<div id="loginResult"></div><div class="small" style="margin-top:8px">If Login does not respond, the error will now be shown here.</div></div>

<div id="mainPanel" style="display:none">
<div class="card"><h3 id="storeName">🏪 Store</h3><p id="storeMeta" class="small"></p>
<div style="background:#fef3c7;padding:10px;border-radius:10px">Today redeemed:
<b id="todayCount" style="font-size:20px;color:#059669">0</b></div></div>

<div class="card"><h3>🎫 Redeem Coupon</h3>
<p class="small">Any valid unused ROI coupon can be redeemed at this active store.</p>
<input id="couponCode" placeholder="Enter coupon code">
<button id="redeemBtn" class="green" onclick="redeemCoupon()">✅ Redeem Coupon</button>
<div id="redeemResult"></div></div>

<div class="card"><h3>📋 Today Redemptions</h3><div id="todayList"></div>
<button class="blue" onclick="loadToday()">🔄 Refresh</button></div>

<div class="card"><h3>📦 My Stock</h3><div id="stockList"></div>
<button class="blue" onclick="loadStock()">🔄 Refresh Stock</button></div>
</div>


<script>
const SUPABASE_URL='https://izmkjarrksemenjzboid.supabase.co';
const SUPABASE_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Iml6bWtqYXJya3NlbWVuanpib2lkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg2NDE4MDgsImV4cCI6MjEwNDIxNzgwOH0.72LWv7KM3lyOa6wbbyaa_lvrkA33iJAhyZiH2a6u8qo';

let sb=null;
let currentStore=null;
let initialized=false;

function msg(id,t,ok=false){
  const el=document.getElementById(id);
  if(el) el.innerHTML='<div class="'+(ok?'ok':'err')+'">'+t+'</div>';
}

function escapeHtml(v){
  return String(v ?? '').replace(/[&<>"']/g, m => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'
  }[m]));
}

function showLoginError(text){
  msg('loginResult','❌ '+text,false);
}

async function init(){
  try{
    if(typeof supabase==='undefined'){
      throw new Error('Supabase library did not load. Check internet connection.');
    }
    if(!SUPABASE_URL || SUPABASE_URL==='YOUR_SUPABASE_URL' ||
       !SUPABASE_KEY || SUPABASE_KEY==='YOUR_SUPABASE_ANON_KEY'){
      throw new Error('Supabase URL / ANON KEY is missing in this HTML file.');
    }
    sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
    initialized=true;
  }catch(e){
    initialized=false;
    showLoginError(e.message || String(e));
  }
}

async function storeLogin(){
  const btn=document.querySelector('#loginCard button');
  const codeEl=document.getElementById('storeCode');
  const phoneEl=document.getElementById('storePhone');

  const code=(codeEl?.value || '').trim().toUpperCase();
  const phone=(phoneEl?.value || '').trim();

  if(!code || !phone){
    showLoginError('Enter store code and phone.');
    return;
  }

  if(!initialized || !sb){
    await init();
    if(!initialized || !sb) return;
  }

  if(btn){
    btn.disabled=true;
    btn.innerText='Logging in...';
  }
  document.getElementById('loginResult').innerHTML =
    '<div class="small">Checking store...</div>';

  try{
    // Store code is normalized to uppercase; phone remains text and is trimmed.
    const r=await sb.from('stores')
      .select('*')
      .eq('store_code',code)
      .eq('phone',phone)
      .limit(1);

    if(r.error){
      throw new Error(r.error.message);
    }

    if(!r.data || !r.data.length){
      showLoginError('Store not found. Check store code and phone number.');
      return;
    }

    currentStore=r.data[0];

    const inactive =
      currentStore.is_active === false ||
      (currentStore.status &&
       String(currentStore.status).trim().toLowerCase() !== 'active');

    if(inactive){
      showLoginError('This store is inactive.');
      currentStore=null;
      return;
    }

    document.getElementById('loginCard').style.display='none';
    document.getElementById('mainPanel').style.display='block';

    document.getElementById('storeName').innerText =
      '🏪 '+(currentStore.name || 'Store');

    document.getElementById('storeMeta').innerText =
      'Code: '+(currentStore.store_code || '')+
      ' | '+(currentStore.town || currentStore.city || '');

    document.getElementById('loginResult').innerHTML='';

    await Promise.all([
      loadToday(),
      loadStock()
    ]);

  }catch(e){
    console.error('Store login error:',e);
    showLoginError(e?.message || String(e) || 'Unable to login.');
  }finally{
    if(btn){
      btn.disabled=false;
      btn.innerText='Login';
    }
  }
}

async function redeemCoupon(){
  if(!currentStore){
    msg('redeemResult','Please login first.');
    return;
  }

  const code=document.getElementById('couponCode').value.trim().toUpperCase();
  if(!code){
    msg('redeemResult','Enter coupon code.');
    return;
  }

  const btn=document.getElementById('redeemBtn');
  btn.disabled=true;
  btn.innerText='Checking...';
  document.getElementById('redeemResult').innerHTML=
    '<div class="small">Checking coupon...</div>';

  try{
    const r=await sb.rpc('flm_redeem_roi_coupon',{
      p_coupon_code:code,
      p_store_id:currentStore.id,
      p_redeemed_by:'STORE'
    });

    if(r.error) throw r.error;

    const d=Array.isArray(r.data)?(r.data[0]||{}):(r.data||{});

    if(!d.success){
      msg('redeemResult','❌ '+(d.message||'Invalid coupon code'));
      return;
    }

    document.getElementById('redeemResult').innerHTML=
      '<div class="ok">✅ Coupon Redeemed Successfully!<br>Amount: Rs.'+
      Number(d.amount||0).toLocaleString('en-IN')+
      '<br><span class="small">FL ID: '+escapeHtml(d.fl_id||'')+
      ' | Store: '+escapeHtml(d.store_name||'')+
      '</span></div>';

    document.getElementById('couponCode').value='';
    await loadToday();

  }catch(e){
    console.error('Redeem error:',e);
    msg('redeemResult','❌ Error: '+(e?.message||String(e)));
  }finally{
    btn.disabled=false;
    btn.innerText='✅ Redeem Coupon';
  }
}

async function loadToday(){
  if(!currentStore) return;

  try{
    const r=await sb.from('roi_coupons')
      .select('*')
      .eq('store_id',currentStore.id)
      .eq('status','redeemed')
      .order('redeemed_at',{ascending:false})
      .limit(100);

    if(r.error) throw r.error;

    const rows=r.data||[];
    const start=new Date();
    start.setHours(0,0,0,0);

    document.getElementById('todayCount').innerText =
      rows.filter(x=>x.redeemed_at && new Date(x.redeemed_at)>=start).length;

    document.getElementById('todayList').innerHTML=rows.length
      ? rows.map(c =>
        '<div style="padding:8px;border-bottom:1px solid #f1f5f9;font-size:12px"><b>'+
        escapeHtml(c.coupon_code||'')+'</b> - Rs.'+
        Number(c.amount||0).toLocaleString('en-IN')+
        '<div class="small">'+escapeHtml(c.redeemed_at||'')+
        '</div></div>'
      ).join('')
      : 'No redemptions yet';

  }catch(e){
    console.error('Today load error:',e);
    document.getElementById('todayList').innerText =
      'Unable to load redemptions: '+(e?.message||String(e));
  }
}

async function loadStock(){
  if(!currentStore) return;

  try{
    const r=await sb.from('store_inventory')
      .select('*')
      .eq('store_id',currentStore.id)
      .order('product_name');

    if(r.error) throw r.error;

    const rows=r.data||[];

    document.getElementById('stockList').innerHTML=rows.length
      ? rows.map(p =>
        '<div style="padding:8px;border:1px solid #e2e8f0;border-radius:8px;margin-bottom:6px">'+
        '<b>'+escapeHtml(p.product_name||'')+'</b><div class="small">Qty: '+
        (p.quantity||0)+' | Rs.'+
        Number(p.price||0).toLocaleString('en-IN')+
        '</div></div>'
      ).join('')
      : 'No stock assigned';

  }catch(e){
    console.error('Stock load error:',e);
    document.getElementById('stockList').innerText =
      'Unable to load stock: '+(e?.message||String(e));
  }
}

document.addEventListener('DOMContentLoaded',init);
</script>

</body></html>
