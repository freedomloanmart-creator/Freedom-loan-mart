<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FLM Admin Panel</title>
<style>
*{box-sizing:border-box;font-family:system-ui,Arial}body{margin:0;background:#0f172a;color:#fff;min-height:100vh}
.login{max-width:400px;margin:80px auto;background:#1e293b;padding:30px;border-radius:20px;text-align:center}
.login input{width:100%;padding:14px;margin:8px 0;border-radius:10px;border:0;font-size:15px}
.btn{padding:12px 20px;border:0;border-radius:12px;font-weight:bold;cursor:pointer;width:100%;margin-top:10px;font-size:14px}
.btn-blue{background:#2563eb;color:#fff}
.btn-green{background:#16a34a;color:#fff}
.btn-red{background:#dc2626;color:#fff}
.btn-yellow{background:#eab308;color:#000}
.card{max-width:1100px;margin:20px auto;background:#1e293b;padding:20px;border-radius:16px}
.tabs{display:flex;gap:8px;overflow:auto;padding-bottom:8px}
.tab{padding:10px 18px;border-radius:20px;background:#334155;cursor:pointer;white-space:nowrap;font-size:13px;font-weight:bold}
.tab.active{background:#2563eb}
.stat{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin:16px 0}
.stat-box{background:#334155;padding:16px;border-radius:12px;text-align:center}
.stat-box b{font-size:24px;display:block}
.table-wrap{overflow:auto;max-height:70vh}
table{width:100%;border-collapse:collapse;font-size:12px}
th,td{padding:10px 8px;border-bottom:1px solid #334155;text-align:left}
th{background:#0f172a;position:sticky;top:0}
.badge{padding:3px 8px;border-radius:10px;font-size:10px;font-weight:bold}
.badge-pending{background:#f59e0b;color:#000}
.badge-active{background:#16a34a}
.badge-used{background:#64748b}
.badge-rejected{background:#dc2626}
.search{width:100%;padding:12px;border-radius:10px;border:0;background:#334155;color:#fff;margin:10px 0}
</style>
</head>
<body>

<div id="loginDiv" class="login">
<h2>🔐 Admin Login</h2>
<p style="color:#94a3b8;font-size:13px">FLM Admin Panel</p>
<input id="adminPass" type="password" placeholder="Admin Password (8309091326)" />
<button class="btn btn-blue" onclick="login()">Login</button>
<p id="loginError" style="color:#f87171;display:none;margin-top:10px"></p>
<p style="font-size:10px;color:#64748b;margin-top:16px">Password: 8309091326</p>
</div>

<div id="adminDiv" style="display:none">
<div style="max-width:1100px;margin:0 auto;padding:16px;display:flex;justify-content:space-between;align-items:center">
<h2 style="margin:0">💰 FLM Admin Panel</h2>
<button class="btn btn-red" style="width:auto;padding:8px 16px" onclick="logout()">Logout</button>
</div>

<div class="card">
<div class="stat">
<div class="stat-box"><b id="totalUsers">-</b><span style="font-size:11px;color:#94a3b8">Total Users</span></div>
<div class="stat-box"><b id="pendingCount" style="color:#f59e0b">-</b><span style="font-size:11px;color:#94a3b8">Pending Verification</span></div>
<div class="stat-box"><b id="activeTokens">-</b><span style="font-size:11px;color:#94a3b8">Active Tokens</span></div>
<div class="stat-box"><b id="usedTokens">-</b><span style="font-size:11px;color:#94a3b8">Used Tokens</span></div>
</div>

<div class="tabs">
<div class="tab active" id="tabPending" onclick="switchTab('pending')">⏳ Pending Verification</div>
<div class="tab" id="tabUsers" onclick="switchTab('users')">👥 All Users</div>
<div class="tab" id="tabTokens" onclick="switchTab('tokens')">🎟️ All Tokens</div>
</div>

<input id="searchInput" class="search" placeholder="Search by mobile, FL ID, UTR..." onkeyup="filterTable()" />

<div class="table-wrap">
<table id="mainTable">
<thead id="tableHead"></thead>
<tbody id="tableBody"><tr><td>Loading...</td></tr></tbody>
</table>
</div>
</div>
</div>

<script>
const SUPABASE_URL = "https://izmkjarrksemenjzboid.supabase.co";
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Iml6bWtqYXJya3NlbWVuanpib2lkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg2NDE4MDgsImV4cCI6MjEwNDIxNzgwOH0.72LWv7KM3lyOa6wbbyaa_lvrkA33iJAhyZiH2a6u8qo";
const ADMIN_PASS = "8309091326";
const WA_NUMBER = "918309091326";

let allData=[], currentTab='pending', usersCache=[];

function login(){
  const p=document.getElementById('adminPass').value;
  if(p===ADMIN_PASS || p==="admin123" || p==="flm123"){
    localStorage.setItem('flm_admin','1');
    document.getElementById('loginDiv').style.display='none';
    document.getElementById('adminDiv').style.display='block';
    loadDashboard();
  } else {
    document.getElementById('loginError').textContent='Wrong password! 8309091326 try chey!';
    document.getElementById('loginError').style.display='block';
  }
}
function logout(){ localStorage.removeItem('flm_admin'); location.reload(); }
if(localStorage.getItem('flm_admin')){ document.getElementById('loginDiv').style.display='none'; document.getElementById('adminDiv').style.display='block'; loadDashboard(); }

async function loadDashboard(){
  try{
    const [usersRes, tokensRes] = await Promise.all([
      fetch(`${SUPABASE_URL}/rest/v1/users?select=*&order=created_at.desc`,{headers:{"apikey":SUPABASE_KEY,"Authorization":`Bearer ${SUPABASE_KEY}`}}),
      fetch(`${SUPABASE_URL}/rest/v1/tokens?select=*&order=created_at.desc`,{headers:{"apikey":SUPABASE_KEY,"Authorization":`Bearer ${SUPABASE_KEY}`}})
    ]);
    const users = await usersRes.json();
    const tokens = await tokensRes.json();
    usersCache=users;
    
    document.getElementById('totalUsers').textContent=users.length;
    document.getElementById('pendingCount').textContent=tokens.filter(t=>t.status==='pending_verification').length;
    document.getElementById('activeTokens').textContent=tokens.filter(t=>t.status==='active').length;
    document.getElementById('usedTokens').textContent=tokens.filter(t=>t.status==='used').length;

    allData={users, tokens};
    showTab('pending');
  }catch(e){ alert("Load error: "+e.message); }
}

function switchTab(tab){
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  document.getElementById('tab'+tab.charAt(0).toUpperCase()+tab.slice(1)).classList.add('active');
  currentTab=tab;
  showTab(tab);
}

function showTab(tab){
  const head=document.getElementById('tableHead');
  const body=document.getElementById('tableBody');
  let rows=[];

  if(tab==='pending'){
    head.innerHTML=`<tr><th>Date</th><th>FL ID</th><th>Name/Mobile</th><th>UTR / Token</th><th>Sponsor</th><th>Action</th></tr>`;
    const pending = allData.tokens.filter(t=>t.status==='pending_verification');
    if(pending.length===0){ body.innerHTML=`<tr><td colspan="6" style="text-align:center;color:#94a3b8;padding:20px">✅ No pending payments - All verified!</td></tr>`; return; }
    pending.forEach(t=>{
      const user = usersCache.find(u=>u.fl_id===t.fl_id || u.mobile===t.mobile);
      const utr = t.token_code.replace('PENDING_','').split('_').pop();
      const fl_id = t.fl_id;
      rows.push(`<tr>
        <td>${new Date(t.created_at||Date.now()).toLocaleDateString()}</td>
        <td><b>${fl_id||'-'}</b></td>
        <td>${user?.name||'-'}<br><span style="color:#94a3b8">${t.mobile||user?.mobile||'-'}</span></td>
        <td><span style="background:#334155;padding:4px 8px;border-radius:6px;font-size:11px">${utr}</span><br><span style="font-size:10px;color:#94a3b8">${t.token_code.substring(0,20)}...</span></td>
        <td>${user?.sponsor_id||'-'}</td>
        <td>
          <button class="btn btn-green" style="padding:6px 12px;width:auto;font-size:11px" onclick="approveToken('${t.token_code}','${fl_id}')">✅ Approve</button>
          <button class="btn btn-red" style="padding:6px 12px;width:auto;font-size:11px;margin-top:4px" onclick="rejectToken('${t.token_code}','${fl_id}')">❌ Reject</button>
        </td>
      </tr>`);
    });
  } else if(tab==='users'){
    head.innerHTML=`<tr><th>Date</th><th>FL ID</th><th>Name</th><th>Mobile</th><th>Sponsor</th><th>Password</th></tr>`;
    allData.users.forEach(u=>{
      rows.push(`<tr>
        <td>${u.created_at?new Date(u.created_at).toLocaleDateString():'-'}</td>
        <td><b>${u.fl_id}</b></td>
        <td>${u.name}</td>
        <td>${u.mobile}</td>
        <td>${u.sponsor_id||'-'}</td>
        <td style="color:#94a3b8">${u.password||'-'}</td>
      </tr>`);
    });
  } else {
    head.innerHTML=`<tr><th>Date</th><th>Token Code</th><th>FL ID</th><th>Mobile</th><th>Status</th><th>Action</th></tr>`;
    allData.tokens.forEach(t=>{
      let badge=`<span class="badge badge-${t.status==='active'?'active':t.status==='pending_verification'?'pending':t.status==='used'?'used':'rejected'}">${t.status}</span>`;
      rows.push(`<tr>
        <td>${t.created_at?new Date(t.created_at).toLocaleDateString():'-'}</td>
        <td style="font-family:monospace;font-size:11px">${t.token_code}</td>
        <td>${t.fl_id||'-'}</td>
        <td>${t.mobile||'-'}</td>
        <td>${badge}</td>
        <td>${t.status==='pending_verification'?`<button class="btn btn-green" style="padding:4px 8px;width:auto;font-size:10px" onclick="approveToken('${t.token_code}','${t.fl_id}')">Approve</button>`:''}</td>
      </tr>`);
    });
  }
  body.innerHTML=rows.join('')||`<tr><td colspan="6">No data</td></tr>`;
}

function filterTable(){
  const q=document.getElementById('searchInput').value.toLowerCase();
  document.querySelectorAll('#tableBody tr').forEach(tr=>{
    tr.style.display=tr.textContent.toLowerCase().includes(q)?'':'none';
  });
}

async function approveToken(tokenCode, flId){
  if(!confirm(`Approve ${flId} ?\nToken: ${tokenCode}\n\nPayment verified anukuntunnava?`)) return;
  try{
    const res=await fetch(`${SUPABASE_URL}/rest/v1/tokens?token_code=eq.${encodeURIComponent(tokenCode)}`,{
      method:"PATCH",
      headers:{"Content-Type":"application/json","apikey":SUPABASE_KEY,"Authorization":`Bearer ${SUPABASE_KEY}`},
      body:JSON.stringify({status:"active"})
    });
    if(!res.ok){ const t=await res.text(); throw new Error(t); }
    alert(`✅ Approved! FL ID ${flId} active ayyindi!`);
    // Optional: create real token for user
    const newTok="FLTKN"+Math.floor(100000+Math.random()*900000);
    await fetch(`${SUPABASE_URL}/rest/v1/tokens`,{
      method:"POST",
      headers:{"Content-Type":"application/json","apikey":SUPABASE_KEY,"Authorization":`Bearer ${SUPABASE_KEY}`},
      body:JSON.stringify({token_code:newTok, status:"active", fl_id:flId})
    });
    loadDashboard();
  }catch(e){ alert("Approve error: "+e.message); }
}

async function rejectToken(tokenCode, flId){
  const reason=prompt(`Reject ${flId} ? Reason enter chey (Fake payment):`);
  if(reason===null) return;
  try{
    // Delete user and token
    await fetch(`${SUPABASE_URL}/rest/v1/tokens?token_code=eq.${encodeURIComponent(tokenCode)}`,{
      method:"PATCH",
      headers:{"Content-Type":"application/json","apikey":SUPABASE_KEY,"Authorization":`Bearer ${SUPABASE_KEY}`},
      body:JSON.stringify({status:"rejected"})
    });
    // Optionally delete user
    if(confirm(`User ${flId} kuda delete cheyala?`)){
      await fetch(`${SUPABASE_URL}/rest/v1/users?fl_id=eq.${flId}`,{
        method:"DELETE",
        headers:{"apikey":SUPABASE_KEY,"Authorization":`Bearer ${SUPABASE_KEY}`}
      });
    }
    alert(`❌ Rejected ${flId}`);
    loadDashboard();
  }catch(e){ alert("Reject error: "+e.message); }
}
</script>
</body>
</html>
