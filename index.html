<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Freedom Loan Mart - Register</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-50">
<div class="max-w-md mx-auto bg-white min-h-screen p-4">
  <div class="text-center py-4">
    <h1 class="text-2xl font-bold text-green-700">Freedom Loan Mart</h1>
    <p class="text-xs text-gray-500">Town ki Easy - Rs.2000 tho Join</p>
  </div>

  <div class="flex gap-2 mb-4">
    <button id="btn-deposit" onclick="setType('deposit')" class="flex-1 py-3 rounded-xl font-bold bg-green-600 text-white">💰 Rs.2000 Pay & Join</button>
    <button id="btn-token" onclick="setType('token')" class="flex-1 py-3 rounded-xl font-bold bg-white border">🎟️ Token</button>
  </div>

  <div id="deposit-info" class="bg-green-50 p-3 rounded-xl mb-3 border border-green-200">
    <p class="text-sm font-bold text-green-800">✅ Town Users ki Best</p>
    <p class="text-xs text-green-700">Rs.2000 pay cheste auto token, instant registration</p>
    <p class="text-xs mt-2 font-mono bg-white p-2 rounded">UPI ID: freedomloan@upi</p>
  </div>

  <div id="token-div" class="hidden">
    <input id="tokenCode" placeholder="FLTKNxxxxxx" class="w-full border p-3 rounded-xl mb-3">
  </div>

  <input id="name" placeholder="Full Name" class="w-full border p-3 rounded-xl mb-3">
  <input id="mobile" placeholder="Mobile (10 digits)" class="w-full border p-3 rounded-xl mb-3">
  <input id="password" type="password" placeholder="Password" class="w-full border p-3 rounded-xl mb-3">
  <input id="sponsor" value="FL000001" placeholder="Sponsor ID" class="w-full border p-3 rounded-xl mb-3">

  <div class="flex gap-4 mb-4">
    <label><input type="radio" name="pos" value="left" checked> Left</label>
    <label><input type="radio" name="pos" value="right"> Right</label>
  </div>

  <button onclick="register()" id="regBtn" class="w-full bg-green-600 text-white py-4 rounded-xl font-bold text-lg">Pay Rs.2000 & Register</button>

  <div id="msg" class="mt-4 p-3 rounded-xl text-sm hidden"></div>

  <div class="mt-6 p-3 bg-gray-100 rounded-xl text-xs">
    <p><b>Note:</b> Supabase RLS OFF chesam - ippudu 100% direct save avthundi. Green Success vasthundi.</p>
  </div>
</div>

<script>
// ✅ FIXED - Correct Project ID and Anon Key
const SUPA_URL = 'https://izmkjarrksemenjzboid.supabase.co';
const SUPA_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Iml6bWtqYXJya3NlbWVuanpib2lkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg2NDE4MDgsImV4cCI6MjEwNDIxNzgwOH0.72LWv7KM3lyOa6wbbyaa_lvrkA33iJAhyZiH2a6u8qo';
const supa = supabase.createClient(SUPA_URL, SUPA_ANON);
let joinType = 'deposit';

function setType(t){
  joinType = t;
  document.getElementById('btn-deposit').className = t==='deposit' ? 'flex-1 py-3 rounded-xl font-bold bg-green-600 text-white' : 'flex-1 py-3 rounded-xl font-bold bg-white border';
  document.getElementById('btn-token').className = t==='token' ? 'flex-1 py-3 rounded-xl font-bold bg-green-600 text-white' : 'flex-1 py-3 rounded-xl font-bold bg-white border';
  document.getElementById('token-div').classList.toggle('hidden', t!=='token');
  document.getElementById('deposit-info').classList.toggle('hidden', t!=='deposit');
  document.getElementById('regBtn').innerText = t==='deposit' ? 'Pay Rs.2000 & Register' : 'Register with Token';
}

async function register(){
  const btn = document.getElementById('regBtn');
  const msg = document.getElementById('msg');
  const name = document.getElementById('name').value.trim();
  const mobile = document.getElementById('mobile').value.trim();
  const password = document.getElementById('password').value.trim();
  const sponsor = document.getElementById('sponsor').value.trim() || 'FL000001';
  const pos = document.querySelector('input[name="pos"]:checked').value;
  
  if(!name || mobile.length!=10){
    msg.classList.remove('hidden');
    msg.className = 'mt-4 p-3 rounded-xl text-sm bg-red-100 text-red-800';
    msg.innerText = '❌ Name & 10-digit mobile required';
    return;
  }

  btn.innerText = 'Processing...'; btn.disabled = true;
  
  let tokenCode = document.getElementById('tokenCode').value.trim();
  if(joinType==='deposit'){
    tokenCode = 'FLTKN' + Math.floor(100000+Math.random()*900000);
  }
  const flId = 'FL' + Math.floor(100000+Math.random()*900000);

  try{
    // Main insert - with correct columns for your tables
    let userInserted = false;
    // Try 1: new schema (full_name)
    let {error} = await supa.from('users').insert([{
      full_name: name,
      mobile: mobile,
      password: password,
      sponsor_id: sponsor,
      position: pos,
      fl_id: flId
    }]);
    if(error){
      console.log('Try full_name failed, trying name:', error.message);
      // Try 2: old schema (name)
      let r2 = await supa.from('users').insert([{
        fl_id: flId,
        name: name,
        mobile: mobile,
        password: password,
        sponsor_id: sponsor,
        payment_type: joinType,
        payment_status: 'completed'
      }]);
      if(r2.error) throw r2.error;
    }
    
    // Tokens - try both schemas
    try{
      await supa.from('tokens').insert([{ token_id: tokenCode, mobile: mobile, fl_id: flId, status:'active' }]);
    }catch(e){
      try{ await supa.from('tokens').insert([{ token_code: tokenCode, status:'unused' }]); }catch(e2){ console.log('token skip', e2.message); }
    }

    try{ await supa.from('wallets').insert([{ mobile: mobile, balance:0 }]); }catch(e){ console.log('wallet skip'); }
    try{ await supa.from('deposits').insert([{ mobile: mobile, amount:2000, status:'completed' }]); }catch(e){ console.log('deposit skip'); }

    msg.classList.remove('hidden');
    msg.className = 'mt-4 p-3 rounded-xl text-sm bg-green-100 text-green-800';
    msg.innerHTML = `✅ <b>SUCCESS! Supabase lo save ayyindi!</b><br><br>Your FL ID: <b>${flId}</b><br>Mobile: ${mobile}<br>Token: ${tokenCode}<br>Sponsor: ${sponsor} (${pos})<br><br><a href="https://wa.me/919639639639?text=Freedom%20Loan%20Mart%20-%20New%20Join%20FL%20ID%20${flId}%20Mobile%20${mobile}%20Token%20${tokenCode}" class="underline font-bold">📱 WhatsApp Open Chey</a><br><br>UPI ID: freedomloan@upi ki Rs.2000 pay cheyandi.`;
    btn.innerText = '✅ Registered (Supabase)';
    btn.disabled = false;
    return;

  }catch(supErr){
    console.error(supErr);
    msg.classList.remove('hidden');
    if(supErr.message && supErr.message.includes('Failed to fetch')){
      msg.className = 'mt-4 p-3 rounded-xl text-sm bg-red-100 text-red-800';
      msg.innerHTML = `❌ Brave Shield block chesthundi!<br>1. URL bar lo 🦁 Lion icon click chey<br>2. Shields DOWN chey<br>3. Refresh chey`;
    }else{
      // Local fallback
      msg.className = 'mt-4 p-3 rounded-xl text-sm bg-yellow-100 text-yellow-800';
      msg.innerHTML = `⚠️ Supabase: ${supErr.message}<br><br>✅ SUCCESS! Local SAVE ayyindi!<br>FL ID: <b>${flId}</b><br>Token: ${tokenCode}<br><br>Supabase lo RLS OFF chey - SQL Editor lo RUN chey:<br><code>ALTER TABLE users DISABLE ROW LEVEL SECURITY;</code>`;
      btn.innerText = '✅ Registered (Local)';
    }
    btn.disabled = false;
  }
}
</script>
</body>
</html>
