<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Freedom Loan Mart - ULTRA MINIMAL FIX</title>
<style>
*{box-sizing:border-box;font-family:system-ui,Arial}body{margin:0;background:#f5f7fb;padding:12px}
.card{max-width:440px;margin:10px auto;background:#fff;border-radius:18px;padding:22px;box-shadow:0 8px 24px rgba(0,0,0,.08)}
h2{text-align:center;color:#1a237e;margin:0 0 4px} .sub{text-align:center;color:#666;font-size:13px;margin-bottom:12px}
.tabs{display:flex;gap:8px;margin:14px 0}
.tab{flex:1;padding:12px;border-radius:12px;border:2px solid #e0e0e0;background:#fff;text-align:center;font-weight:bold;cursor:pointer;font-size:12px}
.tab.active{background:#1a237e;color:#fff;border-color:#1a237e}
.tab.green.active{background:#2e7d32;border-color:#2e7d32}
input{width:100%;padding:12px 14px;border:1px solid #ddd;border-radius:10px;margin:7px 0;font-size:15px}
.btn{width:100%;padding:14px;border:0;border-radius:12px;background:#1a237e;color:#fff;font-weight:bold;font-size:16px;cursor:pointer;margin-top:12px}
.btn:disabled{opacity:.5}
.success{background:#e8f5e9;color:#1b5e20;padding:16px;border-radius:12px;margin-top:14px;display:none;line-height:1.6;font-size:14px;word-break:break-word}
.error{background:#fbe9e7;color:#c62828;padding:12px;border-radius:10px;margin-top:10px;display:none;font-size:12px;word-break:break-all}
.info{background:#e8f5e9;border:1px solid #a5d6a7;padding:10px;border-radius:10px;font-size:11px;color:#2e7d32;margin-bottom:12px}
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:9999;align-items:center;justify-content:center;padding:20px}
.modal.show{display:flex}
.modal-box{background:#fff;border-radius:20px;max-width:360px;width:100%;padding:24px;text-align:center}
.qr-wrap{background:#fff;padding:12px;border:2px dashed #1a237e;border-radius:16px;margin:16px auto;width:fit-content}
.qr-wrap img{width:240px;height:240px;display:block}
</style>
</head>
<body>
<div class="card">
<h2>💰 Freedom Loan Mart</h2>
<div class="sub">MINIMAL FIX - 4 Columns Only</div>
<div class="info">
✅ This version uses ONLY: fl_id, name, mobile, password, sponsor_id<br>
UPI: helpswtechnologies@ptyes | WA: 918309091326<br>
Tokens: FLTKN1001-1005 ✅ Ready
</div>
<div class="tabs">
<div id="tabPay" class="tab active" onclick="switchTab('pay')">💸 Pay & Join</div>
<div id="tabToken" class="tab green" onclick="switchTab('token')">🎟️ Token</div>
</div>

<input id="name" placeholder="Full Name *" />
<input id="mobile" placeholder="Mobile Number *" type="tel" maxlength="10" />
<input id="password" placeholder="Password *" type="password" />
<input id="sponsor" placeholder="Sponsor FL ID" value="FL000001" />

<div id="tokenBox" style="display:none">
<input id="tokenInput" placeholder="Token Code FLTKN1001" style="border:2px solid #2e7d32;background:#f1f8e9" />
</div>

<button id="mainBtn" class="btn">💸 Rs.2000 Pay & Join</button>
<div id="success" class="success"></div>
<div id="error" class="error"></div>
<div id="debug" style="font-size:9px;color:#aaa;margin-top:8px;word-break:break-all"></div>
</div>

<div id="qrModal" class="modal">
<div class="modal-box">
<h3>Scan & Pay Rs.2000</h3>
<div class="qr-wrap"><img id="qrImg" src="" /></div>
<div id="upiDisplay" style="font-weight:bold;font-size:12px"></div>
<a id="upiLink" href="#" style="display:inline-block;background:#eef2ff;padding:10px 16px;border-radius:20px;text-decoration:none;font-size:12px">📱 Click to Pay</a>
<button id="paidBtn" class="btn" style="background:#2e7d32;margin-top:12px">✅ I Paid - Register</button>
<button id="cancelBtn" class="btn" style="background:#fff;color:#1a237e;border:2px solid #1a237e">Cancel</button>
</div>
</div>

<script>
const SUPABASE_URL = "https://izmkjarrksemenjzboid.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Iml6bWtqYXJya3NlbWVuanpib2lkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg2NDE4MDgsImV4cCI6MjEwNDIxNzgwOH0.72LWv7KM3lyOa6wbbyaa_lvrkA33iJAhyZiH2a6u8qo";
const CLIENT_UPI_ID = "helpswtechnologies@ptyes";
const ADMIN_WA = "918309091326";

let currentTab='pay', pending=null;
function switchTab(t){ currentTab=t; document.getElementById('tabPay').classList.toggle('active',t==='pay'); document.getElementById('tabToken').classList.toggle('active',t==='token'); document.getElementById('tokenBox').style.display=t==='token'?'block':'none'; const b=document.getElementById('mainBtn'); b.textContent=t==='token'?'🎟️ Token tho Register':'💸 Rs.2000 Pay & Join'; b.style.background=t==='token'?'#2e7d32':'#1a237e'; }
function showError(m){ document.getElementById('error').textContent=m; document.getElementById('error').style.display='block'; document.getElementById('success').style.display='none'; }
function showSuccess(h){ document.getElementById('success').innerHTML=h; document.getElementById('success').style.display='block'; document.getElementById('error').style.display='none'; }

document.getElementById('mainBtn').addEventListener('click', async ()=>{
  const name=document.getElementById('name').value.trim();
  const mobile=document.getElementById('mobile').value.trim();
  const password=document.getElementById('password').value.trim();
  const sponsor=document.getElementById('sponsor').value.trim()||"FL000001";
  const tokenCode=document.getElementById('tokenInput').value.trim();
  if(!name||!mobile||!password){ showError("Name, Mobile, Password required!"); return; }
  if(!/^[6-9]\d{9}$/.test(mobile)){ showError("Valid mobile!"); return; }
  pending={name,mobile,password,sponsor,tokenCode};

  if(currentTab==='token'){
    if(!tokenCode){ showError("Token enter chey FLTKN1001"); return; }
    await doRegister(true);
  } else {
    const upiStr=`upi://pay?pa=${CLIENT_UPI_ID}&pn=Freedom%20Loan%20Mart&am=2000&cu=INR&tn=FL_${mobile}`;
    document.getElementById('qrImg').src=`https://api.qrserver.com/v1/create-qr-code/?size=300x300&data=${encodeURIComponent(upiStr)}`;
    document.getElementById('upiDisplay').textContent=CLIENT_UPI_ID;
    document.getElementById('upiLink').href=upiStr;
    document.getElementById('qrModal').classList.add('show');
  }
});

document.getElementById('cancelBtn').onclick=()=>document.getElementById('qrModal').classList.remove('show');
document.getElementById('paidBtn').onclick=async()=>{ document.getElementById('qrModal').classList.remove('show'); await doRegister(false); };

async function doRegister(isToken){
  const btn=document.getElementById('mainBtn');
  btn.textContent="⏳ Saving..."; btn.disabled=true;
  document.getElementById('debug').textContent="Checking token if needed...";
  try{
    if(isToken){
      const cr=await fetch(`${SUPABASE_URL}/rest/v1/tokens?token_code=eq.${pending.tokenCode}&select=*`,{headers:{"apikey":SUPABASE_ANON_KEY,"Authorization":`Bearer ${SUPABASE_ANON_KEY}`}});
      const txt=await cr.text();
      document.getElementById('debug').textContent="Token check: "+txt.slice(0,150);
      if(!cr.ok) throw new Error("Token check fail: "+txt);
      const arr=JSON.parse(txt);
      if(arr.length===0) throw new Error("Invalid Token! FLTKN1001 try chey!");
      if(arr[0].status==='used') throw new Error("Token already used! FLTKN1002 try chey!");
    }

    const fl_id="FL"+Math.floor(100000+Math.random()*900000);
    const payload={fl_id:fl_id, name:pending.name, mobile:pending.mobile, password:pending.password, sponsor_id:pending.sponsor};
    document.getElementById('debug').textContent="Inserting: "+JSON.stringify(payload);

    const res=await fetch(`${SUPABASE_URL}/rest/v1/users`,{
      method:"POST",
      headers:{"Content-Type":"application/json","apikey":SUPABASE_ANON_KEY,"Authorization":`Bearer ${SUPABASE_ANON_KEY}`,"Prefer":"return=representation"},
      body:JSON.stringify(payload)
    });
    const resTxt=await res.text();
    document.getElementById('debug').textContent="Users response: "+resTxt.slice(0,200);
    if(!res.ok){
      if(resTxt.includes("duplicate")) throw new Error("Mobile already registered!");
      throw new Error(resTxt);
    }

    if(isToken){
      await fetch(`${SUPABASE_URL}/rest/v1/tokens?token_code=eq.${pending.tokenCode}`,{
        method:"PATCH",
        headers:{"Content-Type":"application/json","apikey":SUPABASE_ANON_KEY,"Authorization":`Bearer ${SUPABASE_ANON_KEY}`},
        body:JSON.stringify({status:"used"})
      });
    } else {
      const newTok="FLTKN"+Math.floor(100000+Math.random()*900000);
      await fetch(`${SUPABASE_URL}/rest/v1/tokens`,{
        method:"POST",
        headers:{"Content-Type":"application/json","apikey":SUPABASE_ANON_KEY,"Authorization":`Bearer ${SUPABASE_ANON_KEY}`},
        body:JSON.stringify({token_code:newTok, status:"active", fl_id:fl_id, mobile:pending.mobile})
      });
    }

    const waLink=`https://wa.me/${ADMIN_WA}?text=${encodeURIComponent(`Hi, Registered FL ID:${fl_id} Mobile:${pending.mobile} ${isToken?`Token:${pending.tokenCode}`:`Paid Rs2000`}`)}`;
    showSuccess(`✅ SUCCESS!<br/>FL ID: <b>${fl_id}</b><br/>Mobile: ${pending.mobile}<br/><a href="${waLink}" target="_blank" style="display:inline-block;background:#25D366;color:#fff;padding:10px 18px;border-radius:20px;text-decoration:none;margin-top:10px">📱 WhatsApp ${ADMIN_WA}</a>`);
    btn.textContent="✅ Registered"; btn.disabled=true;
  }catch(e){ showError("Error: "+e.message); document.getElementById('debug').textContent="ERROR: "+e.message; } finally { if(!btn.disabled || btn.textContent.includes("Saving")){ btn.textContent=currentTab==='token'?'🎟️ Token tho Register':'💸 Rs.2000 Pay & Join'; btn.disabled=false; } }
}
</script>
</body>
</html>
