<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Freedom Loan Mart - Fixed</title>
<style>
*{box-sizing:border-box;font-family:system-ui,Arial}body{margin:0;background:#f5f7fb;padding:12px}
.card{max-width:440px;margin:10px auto;background:#fff;border-radius:18px;padding:22px;box-shadow:0 8px 24px rgba(0,0,0,.08)}
h2{text-align:center;color:#1a237e;margin:0 0 4px} .sub{text-align:center;color:#666;font-size:13px;margin-bottom:12px}
.tabs{display:flex;gap:8px;margin:14px 0}
.tab{flex:1;padding:12px;border-radius:12px;border:2px solid #e0e0e0;background:#fff;text-align:center;font-weight:bold;cursor:pointer;font-size:13px}
.tab.active{background:#1a237e;color:#fff;border-color:#1a237e}
.tab.green.active{background:#2e7d32;border-color:#2e7d32}
input,select{width:100%;padding:12px 14px;border:1px solid #ddd;border-radius:10px;margin:7px 0;font-size:15px}
.btn{width:100%;padding:14px;border:0;border-radius:12px;background:#1a237e;color:#fff;font-weight:bold;font-size:16px;cursor:pointer;margin-top:12px}
.btn:disabled{opacity:.5}
.success{background:#e8f5e9;color:#1b5e20;padding:16px;border-radius:12px;margin-top:14px;display:none;line-height:1.6;font-size:14px;word-break:break-word}
.error{background:#fbe9e7;color:#c62828;padding:12px;border-radius:10px;margin-top:10px;display:none;font-size:13px;word-break:break-all}
.info{background:#e8f5e9;border:1px solid #a5d6a7;padding:10px;border-radius:10px;font-size:12px;color:#2e7d32;margin-bottom:12px}
.info code{background:#fff;padding:2px 6px;border-radius:4px;font-weight:bold}
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:9999;align-items:center;justify-content:center;padding:20px}
.modal.show{display:flex}
.modal-box{background:#fff;border-radius:20px;max-width:360px;width:100%;padding:24px;text-align:center}
.qr-wrap{background:#fff;padding:12px;border:2px dashed #1a237e;border-radius:16px;margin:16px auto;width:fit-content}
.qr-wrap img{width:240px;height:240px;display:block}
.upi-id{background:#eef2ff;padding:10px;border-radius:10px;font-weight:bold;margin:10px 0;color:#1a237e;word-break:break-all;font-size:12px}
.btn-green{background:#2e7d32}
.btn-outline{background:#fff;color:#1a237e;border:2px solid #1a237e}
</style>
</head>
<body>
<div class="card">
<h2>💰 Freedom Loan Mart</h2>
<div class="sub">Joining Fee: Rs.2000 | Instant Token | FIXED</div>
<div class="info">
✅ <b>FIXED Version - Only Users Table</b><br>
UPI: <code>helpswtechnologies@ptyes</code> | WA: 8309091326<br>
Token Sample: FLTKN1001 to FLTKN1005 added ✅
</div>
<div class="tabs">
<div id="tabPay" class="tab active" onclick="switchTab('pay')">💸 Rs.2000 Pay & Join</div>
<div id="tabToken" class="tab green" onclick="switchTab('token')">🎟️ Token</div>
</div>
<input id="name" placeholder="Full Name *" />
<input id="mobile" placeholder="Mobile Number * (10 digits)" type="tel" maxlength="10" />
<input id="password" placeholder="Password *" type="password" />
<input id="sponsor" placeholder="Sponsor FL ID" value="FL000001" />
<select id="position"><option value="left">Left</option><option value="right">Right</option></select>
<div id="tokenBox" style="display:none">
<input id="tokenInput" placeholder="Enter Token Code - FLTKN1001" style="border:2px solid #2e7d32;background:#f1f8e9" />
<p style="font-size:11px;color:#2e7d32;margin:4px 0">Token unna vallu direct - No payment!</p>
</div>
<button id="mainBtn" class="btn">💸 Rs.2000 Pay & Join</button>
<div id="success" class="success"></div>
<div id="error" class="error"></div>
<div id="debug" style="font-size:10px;color:#999;margin-top:10px;word-break:break-all"></div>
</div>

<div id="qrModal" class="modal">
<div class="modal-box">
<h3 style="margin:0;color:#1a237e">Scan & Pay Rs.2000</h3>
<div class="qr-wrap"><img id="qrImg" src="" /></div>
<div class="upi-id" id="upiDisplay"></div>
<a id="upiLink" href="#" style="display:inline-block;background:#eef2ff;padding:10px 16px;border-radius:20px;text-decoration:none;font-weight:bold;font-size:13px;color:#1a237e">📱 Click to Pay</a>
<button id="paidBtn" class="btn btn-green" style="margin-top:14px">✅ I Paid - Register Now</button>
<button id="cancelBtn" class="btn btn-outline">Cancel</button>
</div>
</div>

<script>
const CLIENT_UPI_ID = "helpswtechnologies@ptyes";
const ADMIN_WHATSAPP_NUMBER = "918309091326";
const SUPABASE_URL = "https://izmkjarrksemenjzboid.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Iml6bWtqYXJya3NlbWVuanpib2lkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg2NDE4MDgsImV4cCI6MjEwNDIxNzgwOH0.72LWv7KM3lyOa6wbbyaa_lvrkA33iJAhyZiH2a6u8qo";

let currentTab = 'pay';
let pendingData = null;

function switchTab(tab){
  currentTab = tab;
  document.getElementById('tabPay').classList.toggle('active', tab==='pay');
  document.getElementById('tabToken').classList.toggle('active', tab==='token');
  document.getElementById('tokenBox').style.display = tab==='token' ? 'block' : 'none';
  const btn = document.getElementById('mainBtn');
  btn.textContent = tab==='token' ? '🎟️ Token tho Register' : '💸 Rs.2000 Pay & Join';
  btn.style.background = tab==='token' ? '#2e7d32' : '#1a237e';
  hideError();
}
function showError(msg){ const e=document.getElementById('error'); e.textContent=msg; e.style.display='block'; document.getElementById('success').style.display='none'; console.error(msg); }
function hideError(){ document.getElementById('error').style.display='none'; }
function showSuccess(html){ const s=document.getElementById('success'); s.innerHTML=html; s.style.display='block'; document.getElementById('error').style.display='none'; }
function debug(msg){ document.getElementById('debug').textContent = msg; }

const mainBtn = document.getElementById('mainBtn');
const qrModal = document.getElementById('qrModal');
const qrImg = document.getElementById('qrImg');
const upiDisplay = document.getElementById('upiDisplay');
const upiLink = document.getElementById('upiLink');
const paidBtn = document.getElementById('paidBtn');
const cancelBtn = document.getElementById('cancelBtn');

mainBtn.addEventListener('click', async ()=>{
  hideError();
  const name = document.getElementById('name').value.trim();
  const mobile = document.getElementById('mobile').value.trim();
  const password = document.getElementById('password').value.trim();
  const sponsor = document.getElementById('sponsor').value.trim() || "FL000001";
  const position = document.getElementById('position').value;
  const tokenCode = document.getElementById('tokenInput').value.trim();

  if(!name || !mobile || !password){ showError("Name, Mobile, Password compulsory!"); return; }
  if(!/^[6-9]\d{9}$/.test(mobile)){ showError("Valid 10 digit mobile ivvu!"); return; }
  
  pendingData = {name,mobile,password,sponsor,position,tokenCode};
  debug("Data: "+JSON.stringify(pendingData));

  if(currentTab === 'token'){
    if(!tokenCode){ showError("Token Code enter chey! FLTKN1001"); return; }
    await doTokenRegister();
  } else {
    const upiString = `upi://pay?pa=${CLIENT_UPI_ID}&pn=Freedom%20Loan%20Mart&am=2000&cu=INR&tn=FL_${mobile}`;
    qrImg.src = `https://api.qrserver.com/v1/create-qr-code/?size=300x300&data=${encodeURIComponent(upiString)}`;
    upiDisplay.textContent = CLIENT_UPI_ID + " - Rs.2000";
    upiLink.href = upiString;
    qrModal.classList.add('show');
  }
});

cancelBtn.addEventListener('click', ()=> qrModal.classList.remove('show'));

async function doTokenRegister(){
  mainBtn.textContent="⏳ Checking Token..."; mainBtn.disabled=true;
  try{
    debug("Checking token: "+pendingData.tokenCode);
    const checkRes = await fetch(`${SUPABASE_URL}/rest/v1/tokens?token_code=eq.${pendingData.tokenCode}&select=*`,{
      headers:{"apikey":SUPABASE_ANON_KEY,"Authorization":`Bearer ${SUPABASE_ANON_KEY}`}
    });
    const checkText = await checkRes.text();
    debug("Token check response: "+checkText.substring(0,200));
    if(!checkRes.ok) throw new Error("Token check failed: "+checkText);
    
    let tokens;
    try{ tokens = JSON.parse(checkText); } catch{ throw new Error("Token parse error: "+checkText); }
    
    if(tokens.length===0) throw new Error("Invalid Token! FLTKN1001, FLTKN1002 lanti tokens use chey - Supabase lo add chesam!");
    if(tokens[0].status === 'used') throw new Error("Token already used! Kottha token FLTKN1002 try chey!");

    await doUserInsert(pendingData.tokenCode, true);

  }catch(e){ showError(e.message); debug(e.message); } finally{ mainBtn.textContent="🎟️ Token tho Register"; mainBtn.disabled=false; }
}

paidBtn.addEventListener('click', async ()=>{
  qrModal.classList.remove('show');
  await doUserInsert(null, false);
});

async function doUserInsert(useTokenCode, isTokenFlow){
  mainBtn.textContent="⏳ Saving..."; mainBtn.disabled=true; hideError();
  try{
    const fl_id = "FL"+Math.floor(100000+Math.random()*900000);
    debug("Generating FL ID: "+fl_id);

    // SIMPLEST INSERT - Only columns that definitely exist
    const payload = {
      fl_id: fl_id,
      name: pendingData.name,
      mobile: pendingData.mobile,
      password: pendingData.password,
      sponsor_id: pendingData.sponsor,
      position: pendingData.position
    };
    debug("Insert payload: "+JSON.stringify(payload));

    const resUser = await fetch(`${SUPABASE_URL}/rest/v1/users`,{
      method:"POST",
      headers:{
        "Content-Type":"application/json",
        "apikey":SUPABASE_ANON_KEY,
        "Authorization":`Bearer ${SUPABASE_ANON_KEY}`,
        "Prefer":"return=representation"
      },
      body: JSON.stringify(payload)
    });

    const resText = await resUser.text();
    debug("Users insert response: "+resText.substring(0,300));

    if(!resUser.ok){
      if(resText.includes("duplicate") || resUser.status===409) throw new Error("Mobile already registered! Vere number try chey!");
      throw new Error("Users save error: "+resText);
    }

    // If token flow, mark token as used - but don't fail if this fails
    if(isTokenFlow){
      try{
        await fetch(`${SUPABASE_URL}/rest/v1/tokens?token_code=eq.${useTokenCode}`,{
          method:"PATCH",
          headers:{"Content-Type":"application/json","apikey":SUPABASE_ANON_KEY,"Authorization":`Bearer ${SUPABASE_ANON_KEY}`},
          body: JSON.stringify({status:"used"})
        });
        debug("Token marked used");
      }catch(e){ debug("Token update failed but user saved: "+e.message); }
    } else {
      // For pay flow, create new token for this user
      try{
        const newToken = "FLTKN"+Math.floor(100000+Math.random()*900000);
        await fetch(`${SUPABASE_URL}/rest/v1/tokens`,{
          method:"POST",
          headers:{"Content-Type":"application/json","apikey":SUPABASE_ANON_KEY,"Authorization":`Bearer ${SUPABASE_ANON_KEY}`},
          body: JSON.stringify({token_code:newToken, status:"active", fl_id:fl_id, mobile:pendingData.mobile})
        });
        debug("New token created: "+newToken);
      }catch(e){ debug("New token create failed: "+e.message); }
    }

    const waText = `Hi Sir, Register ayyanu FL ID:${fl_id} Mobile:${pendingData.mobile} ${isTokenFlow?`Token:${useTokenCode}`:`Paid Rs2000`}`;
    const waLink = `https://wa.me/${ADMIN_WHATSAPP_NUMBER}?text=${encodeURIComponent(waText)}`;

    showSuccess(`✅ SUCCESS!<br/>FL ID: <b>${fl_id}</b><br/>Name: ${pendingData.name}<br/>Mobile: ${pendingData.mobile}<br/>${isTokenFlow?`Token Used: ${useTokenCode}`:`Paid: Rs.2000`}<br/><br/><a href="${waLink}" target="_blank" style="display:inline-block;background:#25D366;color:#fff;padding:12px 20px;border-radius:30px;text-decoration:none;font-weight:bold">📱 WhatsApp: ${ADMIN_WHATSAPP_NUMBER}</a>`);
    mainBtn.textContent="✅ Registered!"; mainBtn.disabled=true;
    debug("DONE - FL ID: "+fl_id);

  }catch(e){
    showError("Error: "+e.message);
    debug("ERROR: "+e.message);
  } finally {
    if(!mainBtn.disabled || mainBtn.textContent.includes("Saving")){
      mainBtn.textContent = currentTab==='token' ? '🎟️ Token tho Register' : '💸 Rs.2000 Pay & Join';
      mainBtn.disabled=false;
    }
    paidBtn.textContent="✅ I Paid - Register Now"; paidBtn.disabled=false;
  }
}
</script>
</body>
</html>
