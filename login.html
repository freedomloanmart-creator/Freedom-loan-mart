<!DOCTYPE html><html><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Freedom Loans Mart - Login</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL='https://izmkjarrksemenjzboid.supabase.co';
const SUPABASE_ANON_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Iml6bWtqYXJya3NlbWVuanpib2lkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg2NDE4MDgsImV4cCI6MjEwNDIxNzgwOH0.72LWv7KM3lyOa6wbbyaa_lvrkA33iJAhyZiH2a6u8qo';
let supabaseClient=null;
try{if(typeof supabase!=='undefined'){supabaseClient=supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);}}catch(e){}
async function loginReal(flIdOrMobile,password){
 if(!supabaseClient){return {success:false,message:'Not connected'};}
 try{
  let user=null;
  const {data: byFlId} = await supabaseClient.from('users').select('*').eq('fl_id',flIdOrMobile.toUpperCase()).limit(1);
  if(byFlId&&byFlId.length>0) user=byFlId[0];
  if(!user){
   const {data: byMobile} = await supabaseClient.from('users').select('*').eq('mobile',flIdOrMobile).limit(1);
   if(byMobile&&byMobile.length>0) user=byMobile[0];
  }
  if(!user) return {success:false,message:'No account found'};
  if(user.password!==password) return {success:false,message:'Wrong password'};
  return {success:true,user:user};
 }catch(err){return {success:false,message:err.message};}
}
</script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Inter,system-ui}
body{background:#eef2f7;display:flex;align-items:center;justify-content:center;min-height:100vh;padding:16px}
.card{background:#fff;border-radius:20px;padding:24px;max-width:380px;width:100%;box-shadow:0 4px 20px rgba(0,0,0,.08)}
.input{width:100%;padding:14px;border:1px solid #e2e8f0;border-radius:12px;font-size:14px;margin-bottom:12px;outline:none}
.input:focus{border-color:#2563eb}
.btn{width:100%;padding:14px;border:0;border-radius:12px;font-weight:700;cursor:pointer;font-size:14px}
.btn-primary{background:#2563eb;color:#fff}
.btn-primary:hover{background:#1d4ed8}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#0f172a;color:#fff;padding:10px 16px;border-radius:999px;font-size:12px;z-index:9999}
</style>
</head>
<body>
<div class="card" id="loginWrap">
<div style="text-align:center;margin-bottom:24px"><div style="width:64px;height:64px;background:#2563eb;border-radius:50%;margin:0 auto;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:20px">FLM</div><div style="margin-top:12px;font-weight:800;font-size:18px">FREEDOM LOANS MART</div><div style="font-size:12px;color:#64748b;margin-top:4px">Way to your Financial Freedom</div></div>
<div id="err" style="display:none;background:#fee2e2;color:#991b1b;padding:10px;border-radius:8px;font-size:12px;margin-bottom:12px"></div>
<input id="loginId" placeholder="Enter username" class="input">
<input id="loginPass" type="password" placeholder="Enter password" class="input">
<button id="loginBtn" class="btn btn-primary">Login</button>
<div style="display:flex;gap:8px;margin-top:12px">
<button onclick="demoLogin('FL100001','admin123')" style="flex:1;background:#0f172a;color:#fff;border:0;padding:10px;border-radius:10px;font-size:12px;font-weight:600;cursor:pointer">Admin</button>
<button onclick="document.getElementById('forgotBox').style.display=document.getElementById('forgotBox').style.display==='none'?'block':'none'" style="flex:1;background:#fff;color:#0f172a;border:1px solid #e2e8f0;padding:10px;border-radius:10px;font-size:12px;font-weight:600;cursor:pointer">Forgot?</button>
</div>
<div style="text-align:center;margin-top:16px;font-size:12px;color:#94a3b8">No account? <a href="./register.html" style="color:#2563eb;font-weight:600;text-decoration:none">Register</a></div>
<div id="forgotBox" style="display:none;margin-top:16px;border-top:1px solid #f1f5f9;padding-top:16px">
<div style="font-weight:700;font-size:14px;margin-bottom:8px">Reset Password</div>
<input id="forgotEmail" placeholder="Enter email" type="email" class="input">
<button onclick="sendOtp()" class="btn" style="background:#0f172a;color:#fff">Send OTP</button>
<div id="otpBox" style="display:none;margin-top:10px">
<input id="otpInput" placeholder="Enter OTP" class="input">
<input id="newPass" type="password" placeholder="New Password" class="input">
<button onclick="document.getElementById('forgotMsg').innerHTML='<span style=color:#059669>Success!</span>'" class="btn" style="background:#059669;color:#fff">Reset</button>
</div>
<div id="forgotMsg" style="margin-top:8px;font-size:11px"></div>
</div>
</div>
<script>
function toast(m){let t=document.createElement('div');t.className='toast';t.innerText=m;document.body.appendChild(t);setTimeout(()=>t.remove(),2500);}
function demoLogin(id,pass){document.getElementById('loginId').value=id;document.getElementById('loginPass').value=pass;document.getElementById('loginBtn').click();}
document.getElementById('loginBtn').addEventListener('click',async()=>{
 const id=document.getElementById('loginId').value.trim();const pass=document.getElementById('loginPass').value.trim();
 const err=document.getElementById('err');if(!id||!pass){err.style.display='block';err.innerText='Enter username and password';return;}err.style.display='none';
 const btn=document.getElementById('loginBtn');btn.innerText='Logging in...';btn.disabled=true;
 try{
  const result=await loginReal(id,pass);
  if(result.success){
   const user=result.user;
   const flId=user.fl_id||id.toUpperCase();
   const name=user.full_name||'User';
   const session={flId:flId,fl_id:flId,name:name,full_name:name,mobile:user.mobile||'',email:user.email||'',sponsor_id:user.sponsor_id||'',side:user.side||''};
   localStorage.setItem('flm_session',JSON.stringify(session));
   toast('Welcome '+name+'!');
   setTimeout(()=>{location.href='./index.html';},800);
  }else{
   err.style.display='block';err.innerText=result.message;
   btn.innerText='Login';btn.disabled=false;
  }
 }catch(e){
  err.style.display='block';err.innerText=e.message;
  btn.innerText='Login';btn.disabled=false;
 }
});
function sendOtp(){const email=document.getElementById('forgotEmail').value.trim();const msg=document.getElementById('forgotMsg');if(!email){msg.innerHTML='<span style=color:#dc2626>Enter email</span>';return;}const otp=Math.floor(100000+Math.random()*900000);localStorage.setItem('flm_otp_'+email,otp);msg.innerHTML='OTP: <b>'+otp+'</b>';document.getElementById('otpBox').style.display='block';}
</script>
</body></html>
