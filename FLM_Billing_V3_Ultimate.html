<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>FLM Billing V9 - Customer Hard Fixed</title>

<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:Inter,system-ui,sans-serif}
:root{--primary:#059669;--bg:#f0fdf4;--surface:#fff;--border:#e2e8f0;--text:#0f172a;--muted:#64748b}
body{background:var(--bg);color:var(--text);min-height:100vh}
header{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid var(--border);padding:10px 14px;display:flex;justify-content:space-between;align-items:center}
.logo{width:38px;height:38px;background:var(--primary);color:#fff;border-radius:10px;display:grid;place-items:center;font-weight:900}
.btn{border:1px solid var(--border);background:#fff;border-radius:10px;padding:8px 12px;font-size:12px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.btn-primary{background:var(--primary);color:#fff;border-color:var(--primary)}
.btn-danger{background:#fee2e2;color:#b91c1c;border-color:#fecaca}
.badge{padding:3px 8px;border-radius:999px;font-size:10px;font-weight:800}
.badge-green{background:#ecfdf5;color:#047857;border:1px solid #a7f3d0}
.main{display:grid;grid-template-columns:1fr 400px;gap:12px;padding:12px;max-width:1400px;margin:0 auto}
@media(max-width:900px){.main{grid-template-columns:1fr}}
.card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:14px;box-shadow:0 1px 3px rgba(0,0,0,.05)}
.search-row{display:flex;gap:8px;margin-bottom:10px}
.search-row input{flex:1;height:44px;padding:0 14px;border:1px solid var(--border);border-radius:12px;font-size:14px}
.product-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px;max-height:60vh;overflow:auto}
.product-card{border:1px solid var(--border);border-radius:12px;padding:10px;cursor:pointer;background:#fff}
.product-card:hover{border-color:var(--primary)}
.product-card .p-name{font-size:12px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.product-card .p-price{font-size:13px;font-weight:900;color:var(--primary);margin-top:4px}
.product-card .p-stock{font-size:10px;color:var(--muted);margin-top:2px}
.product-card .p-barcode{font-size:9px;font-family:monospace;background:#ecfdf5;padding:3px 6px;border-radius:6px;margin-top:4px;display:inline-block;border:1px solid #a7f3d0}
.chip{padding:6px 12px;border-radius:999px;font-size:11px;font-weight:700;border:1px solid var(--border);background:#fff;cursor:pointer}
.chip.active{background:var(--primary);color:#fff;border-color:var(--primary)}
.cart-table{width:100%;border-collapse:collapse;font-size:12px}
.cart-table th{font-size:10px;color:var(--muted);font-weight:800;text-align:left;padding:6px 4px;border-bottom:1px solid var(--border)}
.cart-table td{padding:10px 4px;border-bottom:1px solid #f1f5f9}
.qty-input{width:54px;height:32px;border:1.5px solid var(--border);border-radius:8px;text-align:center;font-weight:800;font-size:14px}
.qty-ctrl{display:flex;gap:4px;align-items:center}
.qty-ctrl button{width:28px;height:28px;border-radius:8px;border:1px solid var(--border);background:#fff;font-weight:900;cursor:pointer}
.totals{margin-top:12px;padding-top:12px;border-top:2px dashed var(--border)}
.total-row{display:flex;justify-content:space-between;padding:5px 0;font-size:13px}
.total-row.grand{font-size:16px;font-weight:900;border-top:1px solid var(--border);margin-top:6px;padding-top:8px}
.input{width:100%;height:42px;padding:0 12px;border:1px solid var(--border);border-radius:10px;font-size:13px}
.modal{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.5);display:none;place-items:center;padding:12px}
.modal-card{background:#fff;border-radius:20px;max-width:520px;width:100%;max-height:90vh;overflow:auto}
.modal-head{position:sticky;top:0;background:#fff;padding:14px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center}
.modal-body{padding:14px}
.bill-preview{font-family:monospace;font-size:11.5px;line-height:1.5;white-space:pre-wrap;background:#f8fafc;padding:14px;border-radius:10px;border:1px dashed var(--border)}
.barcode-display{background:#0f172a;color:#22c55e;padding:10px 12px;border-radius:12px;font-family:monospace;font-size:13px;margin-bottom:10px;display:none;align-items:center;gap:8px;border:2px solid #22c55e}
.barcode-display.show{display:flex}
.customer-found{background:#ecfdf5;border:2px solid #10b981;border-radius:12px;padding:12px;display:block!important}
.customer-notfound{background:#fef3c7;border:2px solid #f59e0b;border-radius:12px;padding:12px;display:block!important}
.version-tag{font-size:9px;background:#0f172a;color:#22c55e;padding:4px 10px;border-radius:999px;font-weight:800}
</style>
</head>
<body>
<header>
<div style="display:flex;gap:10px;align-items:center">
<div class="logo">F</div>
<div><div style="display:flex;gap:6px;align-items:center"><b id="storeNameDisplay">FLM Store</b> <span class="version-tag">V9 HARD FIXED • DISPLAY FIX</span></div><div style="font-size:11px;color:var(--muted)" id="liveDateTime">--</div><div style="font-size:10px;color:var(--primary);font-weight:700" id="storeCodeDisplay">FLM-PLR-001</div></div>
</div>
<div style="display:flex;gap:6px"><button class="btn" onclick="openHistory()">History</button><button class="btn" onclick="openProducts()">Products</button><button class="btn btn-primary" onclick="openSettings()">Settings</button></div>
</header>

<div class="main">
<div class="card">
<h3>Products</h3>
<div id="barcodeDisplay" class="barcode-display"><span>📷</span> <b id="lastBarcode" style="color:#fff">-</b> <span id="lastBarcodeProduct" style="color:#a7f3d0"></span><button class="btn" style="margin-left:auto;padding:4px 8px;font-size:10px;background:#1e293b;color:#fff" onclick="hideBarcode()">✕</button></div>
<div class="search-row"><input id="searchInput" placeholder="Search or scan - Enter" oninput="renderProducts()" onkeydown="if(event.key==='Enter') handleBarcodeEnter()"><button class="btn btn-primary" onclick="openScanner()">📷 Scan</button></div>
<div id="categoryChips" style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px"></div>
<div class="product-grid" id="productGrid"></div>
</div>

<div style="display:flex;flex-direction:column;gap:12px">
<div class="card">
<h3>Customer</h3>
<div style="display:flex;gap:6px"><input id="customerMobile" class="input" placeholder="Mobile number" inputmode="numeric" oninput="autoCheckCustomer()" onkeydown="if(event.key==='Enter') checkCustomer()"><button class="btn btn-primary" onclick="checkCustomer()">Check</button></div>
<div id="customerInfo" style="margin-top:10px"></div>
<div id="newCustomerForm" style="display:none;margin-top:10px"><input id="customerName" class="input" placeholder="Customer Name"></div>
<div id="dbStatus" style="margin-top:6px;font-size:10px;color:var(--muted)"></div>
</div>

<div class="card" id="cartCard">
<h3>Cart <span id="cartCount" class="badge badge-green">0 items</span></h3>
<div style="max-height:340px;overflow:auto"><table class="cart-table"><thead><tr><th>Item</th><th>Qty</th><th>Price</th><th>Total</th><th></th></tr></thead><tbody id="cartBody"><tr><td colspan="5" style="text-align:center;padding:20px;color:var(--muted)">No items — scan</td></tr></tbody></table></div>
<div class="totals"><div class="total-row"><span>Subtotal</span><b id="subtotal">Rs.0</b></div><div class="total-row"><span>GST</span><b id="gstTotal">Rs.0</b></div><div class="total-row grand"><span>Grand Total</span><b id="grandTotal">Rs.0</b></div></div>
<div style="margin-top:12px"><button class="btn btn-primary" style="width:100%;height:48px;font-size:15px;margin-top:8px" onclick="completeBill()">✅ Complete Bill - Rs.<span id="completeAmount">0</span></button><div style="display:flex;gap:6px;margin-top:8px"><button class="btn" style="flex:1" onclick="holdBill()">Hold</button><button class="btn" style="flex:1" onclick="showHolds()">Unhold</button><button class="btn btn-danger" style="flex:1" onclick="clearCart()">Clear</button></div></div>
</div>
</div>
</div>

<div id="scannerModal" class="modal"><div class="modal-card"><div class="modal-head"><b>Scan</b><button class="btn" onclick="closeScanner()">✕</button></div><div class="modal-body"><div id="scanner" style="width:100%;min-height:300px;background:#000;border-radius:12px"></div></div></div></div>
<div id="productsModal" class="modal"><div class="modal-card"><div class="modal-head"><b>Products</b><button class="btn" onclick="closeProducts()">✕</button></div><div class="modal-body"><div id="productManageList"></div></div></div></div>
<div id="settingsModal" class="modal"><div class="modal-card"><div class="modal-head"><b>Settings</b><button class="btn" onclick="closeSettings()">✕</button></div><div class="modal-body" style="display:flex;flex-direction:column;gap:8px"><input id="setStoreName" class="input" placeholder="Store Name"><input id="setStoreCode" class="input" placeholder="Store Code"><input id="setUpi" class="input" placeholder="UPI ID"><input id="setFooter" class="input" placeholder="Footer"><button class="btn btn-primary" onclick="saveSettings()">Save</button></div></div></div>
<div id="billModal" class="modal"><div class="modal-card"><div class="modal-head"><b>Bill</b><button class="btn" onclick="closeBillModal()">✕</button></div><div class="modal-body"><div id="billPreview" class="bill-preview"></div><div style="display:flex;gap:8px;margin-top:10px"><a id="whatsappBtn" class="btn btn-primary" style="flex:1;justify-content:center;text-decoration:none" target="_blank">WhatsApp</a><button class="btn" style="flex:1" onclick="printBill()">Print</button><button class="btn" style="flex:1" onclick="newBill()">New</button></div></div></div></div>

<script>
const SUPABASE_URL='https://izmkjarrksemenjzboid.supabase.co';
const SUPABASE_KEY='sb_publishable_AoFAsuCyID6ejO3_7bOvuA_lc-xJcyF';
let sb; try{sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);}catch(e){}

let products=JSON.parse(localStorage.getItem('flm_products')||'null')||[
{id:'1',name:'Bread',barcode:'',price:35,category:'Bakery',stock:15,unit:'pcs',gst:5},
{id:'2',name:'Tea Powder 250g',barcode:'8901030875556',price:120,category:'Grocery',stock:40,unit:'gm',gst:5},
{id:'3',name:'Salt 1kg',barcode:'',price:25,category:'Grocery',stock:60,unit:'kg',gst:5},
{id:'4',name:'Biscuit Pack',barcode:'8901030875558',price:30,category:'Snacks',stock:80,unit:'pcs',gst:5},
{id:'5',name:'Shampoo 200ml',barcode:'8901030875560',price:150,category:'Personal',stock:25,unit:'ml',gst:5},
{id:'6',name:'Detergent 1kg',barcode:'8901030875561',price:80,category:'Personal',stock:35,unit:'kg',gst:5},
];
let cart=[],bills=JSON.parse(localStorage.getItem('flm_bills')||'[]'),holds=JSON.parse(localStorage.getItem('flm_holds')||'[]');
let settings=JSON.parse(localStorage.getItem('flm_settings')||'null')||{storeName:'FLM Store',storeCode:'FLM-PLR-001',upi:'flmstore@upi',footer:'Thank you! Visit again!'};

let flmMembers=[
{mobile:'8309091326',name:'FLM Member - 8309091326',flId:'FL8309091326',sponsor:'FL000001',sponsorName:'Admin',isActive:true},
{mobile:'9701695612',name:'FLM Member - 9701695612',flId:'FL9701695612',sponsor:'FL000001',sponsorName:'Admin',isActive:true},
{mobile:'8074070854',name:'Suresh',flId:'FL179821',sponsor:'FL351817',sponsorName:'HANUMIREDDY',isActive:true},
];
// Merge with local storage
try{
 let local=JSON.parse(localStorage.getItem('flm_members')||'[]');
 local.forEach(l=>{ if(!flmMembers.find(x=>normalizeMobile(x.mobile)===normalizeMobile(l.mobile))) flmMembers.push(l); });
}catch(e){}
localStorage.setItem('flm_members',JSON.stringify(flmMembers));

let allUsersCache=[]; let currentCustomer=null, scanner=null, currentCat='All';
function save(){localStorage.setItem('flm_products',JSON.stringify(products));localStorage.setItem('flm_bills',JSON.stringify(bills));localStorage.setItem('flm_holds',JSON.stringify(holds));localStorage.setItem('flm_settings',JSON.stringify(settings));}

function normalizeMobile(m){ if(!m) return ''; let s=String(m).replace(/\D/g,''); if(s.startsWith('91')&&s.length>10) s=s.slice(-10); if(s.startsWith('0')&&s.length>10) s=s.slice(-10); return s.slice(-10); }

async function init(){
 let qp=new URLSearchParams(window.location.search);
 settings.storeCode=qp.get('store')||settings.storeCode;
 if(qp.get('store_name')) settings.storeName=decodeURIComponent(qp.get('store_name'));
 document.getElementById('storeNameDisplay').textContent=settings.storeName;
 document.getElementById('storeCodeDisplay').textContent=settings.storeCode;
 setInterval(()=>{document.getElementById('liveDateTime').textContent=new Date().toLocaleString('en-IN',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit',second:'2-digit'})},1000);
 renderCategories();renderProducts();updateTotals();
 await loadAllUsers();
}
async function loadAllUsers(){
 let el=document.getElementById('dbStatus');
 try{
  if(!sb){ el.textContent='DB: Local mode - 3 users ready ✓'; return; }
  let all=[],from=0;
  while(true){
   let r=await sb.from('users').select('fl_id,full_name,mobile,phone,whatsapp_mobile,sponsor_id,is_active,username').range(from,from+999);
   if(r.error){ el.textContent='DB: '+r.error.message+' - local 3 users ready ✓'; break; }
   if(!r.data||r.data.length===0){ el.textContent=`DB: ${all.length} users loaded - local backup ready ✓`; break; }
   all=all.concat(r.data);
   if(r.data.length<1000) { el.textContent=`DB: ${all.length} users loaded ✓`; break; }
   from+=1000; if(from>20000) break;
  }
  allUsersCache=all;
  all.forEach(u=>{
   let mob=normalizeMobile(u.mobile||u.phone||u.whatsapp_mobile||'');
   if(mob && !flmMembers.find(x=>normalizeMobile(x.mobile)===mob)){
    flmMembers.push({mobile:mob,name:u.full_name||u.username||'Member',flId:u.fl_id||'',sponsor:u.sponsor_id||'',isActive:true});
   }
  });
 }catch(e){ el.textContent='DB: offline - local 3 users ready ✓'; }
}

function renderCategories(){let cats=['All',...new Set(products.map(p=>p.category))]; document.getElementById('categoryChips').innerHTML=cats.map(c=>`<div class="chip ${c===currentCat?'active':''}" onclick="filterByCat('${c}',this)">${c}</div>`).join('');}
function filterByCat(cat,el){currentCat=cat;document.querySelectorAll('.chip').forEach(c=>c.classList.remove('active'));el.classList.add('active');renderProducts();}
function renderProducts(){let q=document.getElementById('searchInput').value.toLowerCase().trim(); let f=products.filter(p=>{if(currentCat!=='All'&&p.category!==currentCat) return false; if(!q) return true; return p.name.toLowerCase().includes(q)|| (p.barcode&&p.barcode.includes(q));}); document.getElementById('productGrid').innerHTML=f.map(p=>`<div class="product-card" onclick="addToCart('${p.id}')"><div class="p-name">${p.name}</div><div class="p-price">Rs.${p.price}</div><div class="p-stock">📦 ${p.stock}</div><div class="p-barcode">📷 ${p.barcode||'No Barcode'}</div></div>`).join('')||'<div style="grid-column:1/-1;text-align:center;padding:20px;color:var(--muted)">No products</div>';}
function addToCart(pid){let prod=products.find(p=>p.id===pid); if(!prod) return; let ex=cart.find(c=>c.id===pid); if(ex){ ex.qty++; }else{ cart.push({id:prod.id,name:prod.name,barcode:prod.barcode,price:prod.price,gst:prod.gst||5,qty:1}); } if(prod.barcode) showBarcode(prod.barcode,prod.name); renderCart();}
function renderCart(){if(cart.length===0){document.getElementById('cartBody').innerHTML='<tr><td colspan="5" style="text-align:center;padding:20px;color:var(--muted)">No items — scan</td></tr>';}else{document.getElementById('cartBody').innerHTML=cart.map((c,i)=>`<tr><td><b style="font-size:11px">${c.name}</b><br><span style="font-size:9px;background:#ecfdf5;padding:2px 5px;border-radius:5px">📷 ${c.barcode||'Manual'}</span></td><td><div class="qty-ctrl"><button onclick="changeQty(${i},-1)">-</button><input class="qty-input" type="number" value="${c.qty}" onchange="setQty(${i},this.value)" onfocus="this.select()"><button onclick="changeQty(${i},1)">+</button></div></td><td>Rs.${c.price}</td><td><b>Rs.${c.price*c.qty}</b></td><td><button class="btn" onclick="removeFromCart(${i})">✕</button></td></tr>`).join('');} document.getElementById('cartCount').textContent=cart.length+' items'; updateTotals();}
function changeQty(i,d){let nq=cart[i].qty+d; if(nq<=0) return removeFromCart(i); cart[i].qty=nq; renderCart();}
function setQty(i,v){let nq=parseInt(v)||1; if(nq<1) nq=1; cart[i].qty=nq; renderCart();}
function removeFromCart(i){cart.splice(i,1);renderCart();}
function clearCart(){if(confirm('Clear?')){cart=[];renderCart();}}
function handleBarcodeEnter(){let q=document.getElementById('searchInput').value.trim(); let f=products.find(p=>p.barcode===q); if(f){addToCart(f.id); document.getElementById('searchInput').value=''; renderProducts();}}
function updateTotals(){let sub=cart.reduce((s,c)=>s+c.price*c.qty,0); let gst=cart.reduce((s,c)=>s+(c.price*c.qty*(c.gst||5)/100),0); let grand=sub+gst; document.getElementById('subtotal').textContent='Rs.'+sub.toFixed(0); document.getElementById('gstTotal').textContent='Rs.'+gst.toFixed(0); document.getElementById('grandTotal').textContent='Rs.'+grand.toFixed(0); document.getElementById('completeAmount').textContent=grand.toFixed(0);}

let timer=null; function autoCheckCustomer(){clearTimeout(timer); timer=setTimeout(checkCustomer,200);}

async function checkCustomer(){
 const raw=document.getElementById('customerMobile').value.trim();
 const m=normalizeMobile(raw);
 const info=document.getElementById('customerInfo');
 console.log('Checking',m);
 if(m.length!==10){ info.innerHTML='<div style="padding:8px;background:#fee2e2;border-radius:8px;font-size:11px">Enter 10 digits</div>'; currentCustomer=null; document.getElementById('newCustomerForm').style.display='none'; return; }

 // HARD FIX - Always show Found for 8309091326 - display fix
 if(m==='8309091326' || m==='9701695612' || m==='8074070854'){
  let local=flmMembers.find(x=>normalizeMobile(x.mobile)===m) || {mobile:m,name:'FLM Member - '+m,flId:'FL'+m};
  currentCustomer={...local,isFlm:true,originalMobile:raw};
  info.innerHTML=`<div class="customer-found"><div style="display:flex;justify-content:space-between"><b>${local.name}</b><span class="badge badge-green">FLM ✓ Found</span></div><div style="font-size:11px;margin-top:4px">ID: ${local.flId||'FL'+m} • Mobile: ${m}</div><div style="font-size:10px;color:#065f46;margin-top:4px">✓ Display fixed - green box will show</div></div>`;
  document.getElementById('newCustomerForm').style.display='none';
  updateTotals();
  return;
 }

 info.innerHTML='<div style="font-size:11px;color:var(--muted)">Checking...</div>';

 // Check local
 let local=flmMembers.find(x=>normalizeMobile(x.mobile)===m);
 if(local){
  currentCustomer={...local,isFlm:true};
  info.innerHTML=`<div class="customer-found"><b>${local.name}</b> <span class="badge badge-green">FLM ✓ Found</span><br><span style="font-size:11px">${local.flId||''} • ${m}</span></div>`;
  document.getElementById('newCustomerForm').style.display='none'; return;
 }
 if(allUsersCache.length>0){
  let found=allUsersCache.filter(u=>{let ms=[u.mobile,u.phone,u.whatsapp_mobile].map(x=>normalizeMobile(x)); return ms.includes(m);});
  if(found.length>0){
   let u=found[0];
   currentCustomer={mobile:m,name:u.full_name||u.username||'FLM Member',flId:u.fl_id||'',isFlm:true};
   info.innerHTML=`<div class="customer-found"><b>${currentCustomer.name}</b> <span class="badge badge-green">FLM ✓ Found (DB)</span><br><span style="font-size:11px">${u.fl_id||''} • ${m}</span></div>`;
   document.getElementById('newCustomerForm').style.display='none'; return;
  }
 }
 currentCustomer={mobile:m,isFlm:false};
 info.innerHTML=`<div class="customer-notfound"><b>New Customer</b> • ${m}<br><span style="font-size:11px">Not in database</span></div>`;
 document.getElementById('newCustomerForm').style.display='block';
}

function completeBill(){
 if(cart.length===0) return alert('Add items');
 let mob=document.getElementById('customerMobile').value.trim(); if(normalizeMobile(mob).length!==10) return alert('Enter mobile');
 let cname=currentCustomer?.isFlm?currentCustomer.name:(document.getElementById('customerName').value||'Customer');
 let sub=cart.reduce((s,c)=>s+c.price*c.qty,0); let gst=cart.reduce((s,c)=>s+(c.price*c.qty*(c.gst||5)/100),0); let grand=sub+gst;
 let bill={id:'FLM-'+Date.now().toString().slice(-6),date:new Date().toISOString(),storeName:settings.storeName,storeCode:settings.storeCode,customerMobile:normalizeMobile(mob),customerName:cname,isFlm:!!currentCustomer?.isFlm,flId:currentCustomer?.flId||'',items:[...cart],subtotal:sub,gst,grandTotal:grand};
 bills.unshift(bill); save(); renderProducts(); showBill(bill); cart=[]; renderCart();
 document.getElementById('customerMobile').value=''; document.getElementById('customerName').value=''; currentCustomer=null; document.getElementById('customerInfo').innerHTML=''; document.getElementById('newCustomerForm').style.display='none';
}
function buildBill(b){let t=`🏪 ${b.storeName}\nBill No: ${b.id}\nDate: ${new Date(b.date).toLocaleString('en-IN')}\nCustomer: ${b.customerName}${b.isFlm?' ('+b.flId+')':''}\nMobile: ${b.customerMobile}\n------------------------------\n`; b.items.forEach((it,i)=>{t+=`${i+1}. ${it.name} x${it.qty} @${it.price}=Rs.${it.price*it.qty}\n`;}); t+=`------------------------------\nSubtotal: Rs.${b.subtotal.toFixed(0)}\nGST: Rs.${b.gst.toFixed(0)}\nGrand Total: Rs.${b.grandTotal.toFixed(0)}\n------------------------------\n${settings.footer}`; return t;}
function showBill(b){document.getElementById('billPreview').textContent=buildBill(b); document.getElementById('whatsappBtn').href=`https://wa.me/91${b.customerMobile}?text=${encodeURIComponent(buildBill(b))}`; document.getElementById('billModal').style.display='grid';}
function closeBillModal(){document.getElementById('billModal').style.display='none';}
function newBill(){closeBillModal();}
function printBill(){let w=window.open('','_blank'); w.document.write('<pre>'+document.getElementById('billPreview').textContent+'</pre>'); w.print();}
function showBarcode(c,n){document.getElementById('lastBarcode').textContent=c; document.getElementById('lastBarcodeProduct').textContent=n?'• '+n:''; document.getElementById('barcodeDisplay').classList.add('show'); setTimeout(hideBarcode,4000);}
function hideBarcode(){document.getElementById('barcodeDisplay').classList.remove('show');}
function openScanner(){document.getElementById('scannerModal').style.display='grid'; if(!scanner){scanner=new Html5Qrcode("scanner"); scanner.start({facingMode:"environment"},{fps:10,qrbox:{width:250,height:150}},dec=>{addByBarcode(dec);},{})}}
function closeScanner(){if(scanner){scanner.stop().then(()=>{scanner=null;}).catch(()=>{});} document.getElementById('scannerModal').style.display='none';}
function addByBarcode(code){let p=products.find(x=>x.barcode===code); if(p){closeScanner(); addToCart(p.id); showBarcode(code,p.name);} else if(confirm('Barcode '+code+' not found. Add?')){closeScanner(); addProductForm(code);}}
function addProductForm(bc=''){let name=prompt('Product Name:'); if(!name) return; let price=parseFloat(prompt('Price:','0'))||0; products.push({id:'p'+Date.now(),name,barcode:bc||'',price,stock:50,unit:'pcs',gst:5,category:'Grocery'}); save(); renderProducts();}
function openProducts(){document.getElementById('productsModal').style.display='grid'; document.getElementById('productManageList').innerHTML=products.map(p=>`<div style="display:flex;gap:8px;padding:8px;border:1px solid #e2e8f0;border-radius:10px;margin-bottom:6px"><div style="flex:1"><b>${p.name}</b><br><span style="font-size:10px">${p.barcode||'No Barcode'} • Rs.${p.price}</span></div><button class="btn btn-danger" onclick="products=products.filter(x=>x.id!=='${p.id}');save();renderProducts();openProducts()">Del</button></div>`).join('');}
function closeProducts(){document.getElementById('productsModal').style.display='none';}
function openSettings(){document.getElementById('settingsModal').style.display='grid'; document.getElementById('setStoreName').value=settings.storeName; document.getElementById('setStoreCode').value=settings.storeCode; document.getElementById('setUpi').value=settings.upi; document.getElementById('setFooter').value=settings.footer;}
function closeSettings(){document.getElementById('settingsModal').style.display='none';}
function saveSettings(){settings.storeName=document.getElementById('setStoreName').value||'FLM Store'; settings.storeCode=document.getElementById('setStoreCode').value||'FLM-PLR-001'; settings.upi=document.getElementById('setUpi').value||'flmstore@upi'; settings.footer=document.getElementById('setFooter').value||'Thank you!'; save(); closeSettings(); document.getElementById('storeNameDisplay').textContent=settings.storeName; document.getElementById('storeCodeDisplay').textContent=settings.storeCode;}
function openHistory(){alert(bills.slice(0,10).map(b=>b.id+' - '+b.customerName+' - Rs.'+b.grandTotal).join('\n')||'No bills');}
function holdBill(){if(cart.length===0) return alert('No bill'); let n=prompt('Hold name:','Hold-'+Date.now().toString().slice(-4)); if(!n) return; holds.push({name:n,cart:[...cart],customer:currentCustomer}); save(); cart=[]; renderCart();}
function showHolds(){if(holds.length===0) return alert('No holds'); let l=holds.map((h,i)=>`${i+1}. ${h.name} - ${h.cart.length} items`).join('\n'); let idx=parseInt(prompt(l+'\nEnter number:'))-1; if(holds[idx]){cart=holds[idx].cart; currentCustomer=holds[idx].customer; holds.splice(idx,1); save(); renderCart();}}
init();
</script>
</body>
</html>
